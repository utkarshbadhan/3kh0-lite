<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paint</title>
<link rel="stylesheet" href="/apps/app.css"><script src="/apps/app.js"></script>
<style>
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; }
  .tool { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; font-size: 18px; display: grid; place-items: center; }
  .tool.on { border-color: var(--a1); box-shadow: 0 0 0 3px color-mix(in srgb, var(--a1) 30%, transparent); }
  .sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); cursor: pointer; }
  .sw.on { border-color: #fff; transform: scale(1.12); }
  .sep { width: 1px; height: 30px; background: var(--line-strong); }
  input[type=color] { width: 40px; height: 40px; border: 0; background: none; padding: 0; cursor: pointer; }
  input[type=range] { accent-color: var(--a1); }
  .board { flex: 1; border-radius: 20px; overflow: hidden; border: 1px solid var(--line-strong); background: #fff; position: relative; touch-action: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel bar">
    <button class="tool on" data-tool="pen" title="Brush">✏️</button>
    <button class="tool" data-tool="eraser" title="Eraser">🧽</button>
    <button class="tool" data-tool="line" title="Line">╱</button>
    <button class="tool" data-tool="rect" title="Rectangle">▭</button>
    <button class="tool" data-tool="circle" title="Circle">◯</button>
    <button class="tool" data-tool="fill" title="Fill">🪣</button>
    <span class="sep"></span>
    <div class="row" id="swatches"></div>
    <input type="color" id="color" value="#8b5cf6" title="Custom colour">
    <span class="sep"></span>
    <label class="row muted" style="font-size:13px">Size <input type="range" id="size" min="1" max="60" value="6"></label>
    <span style="flex:1"></span>
    <button class="btn sm ghost" id="undo" title="Ctrl+Z">Undo</button>
    <button class="btn sm ghost" id="clear">Clear</button>
    <button class="btn sm" id="save">Save PNG</button>
  </div>
  <div class="board" id="board"><canvas id="c"></canvas></div>
</div>
<script>
(function () {
  const store = AppStore("paint");
  const c = document.getElementById("c"), ctx = c.getContext("2d", { willReadFrequently: true }), board = document.getElementById("board");
  const colors = ["#111111", "#ffffff", "#ef4444", "#f97316", "#facc15", "#22c55e", "#22d3ee", "#3b82f6", "#8b5cf6", "#ec4899"];
  let tool = "pen", color = "#8b5cf6", size = 6, drawing = false, start = null, snap = null, undo = [];
  const sw = document.getElementById("swatches");
  sw.innerHTML = colors.map((k) => `<span class="sw" data-c="${k}" style="background:${k}"></span>`).join("");
  sw.onclick = (e) => { const s = e.target.closest("[data-c]"); if (s) { color = s.dataset.c; document.getElementById("color").value = color; mark(); } };
  const mark = () => sw.querySelectorAll(".sw").forEach((s) => s.classList.toggle("on", s.dataset.c === color));
  document.getElementById("color").oninput = (e) => { color = e.target.value; mark(); };
  document.getElementById("size").oninput = (e) => (size = +e.target.value);
  document.querySelectorAll("[data-tool]").forEach((b) => (b.onclick = () => { tool = b.dataset.tool; document.querySelectorAll("[data-tool]").forEach((x) => x.classList.toggle("on", x === b)); }));

  function resize() {
    const dpr = window.devicePixelRatio || 1, r = board.getBoundingClientRect();
    const keep = c.width ? ctx.getImageData(0, 0, c.width, c.height) : null;
    c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    if (keep) ctx.putImageData(keep, 0, 0);
  }
  function restore() {
    const saved = store.get("img", null);
    if (!saved) return;
    const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = saved;
  }
  const persist = () => { try { store.set("img", c.toDataURL("image/png")); } catch (e) {} };
  const pos = (e) => { const r = c.getBoundingClientRect(), k = c.width / r.width; return { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k, k }; };
  const pushUndo = () => { undo.push(ctx.getImageData(0, 0, c.width, c.height)); if (undo.length > 30) undo.shift(); };
  function stroke(p) {
    ctx.lineCap = ctx.lineJoin = "round"; ctx.lineWidth = size * p.k;
    ctx.strokeStyle = tool === "eraser" ? "#ffffff" : color;
  }
  function shape(p) {
    ctx.putImageData(snap, 0, 0); stroke(p); ctx.beginPath();
    if (tool === "line") { ctx.moveTo(start.x, start.y); ctx.lineTo(p.x, p.y); }
    else if (tool === "rect") ctx.rect(start.x, start.y, p.x - start.x, p.y - start.y);
    else if (tool === "circle") { const rx = Math.abs(p.x - start.x) / 2, ry = Math.abs(p.y - start.y) / 2; ctx.ellipse((p.x + start.x) / 2, (p.y + start.y) / 2, rx, ry, 0, 0, Math.PI * 2); }
    ctx.stroke();
  }
  function flood(x, y) {
    x |= 0; y |= 0;
    const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data, w = c.width, h = c.height;
    const i0 = (y * w + x) * 4, t = [d[i0], d[i0 + 1], d[i0 + 2]];
    const f = [parseInt(color.slice(1, 3), 16), parseInt(color.slice(3, 5), 16), parseInt(color.slice(5, 7), 16)];
    const near = (i) => Math.abs(d[i] - t[0]) + Math.abs(d[i + 1] - t[1]) + Math.abs(d[i + 2] - t[2]) < 60;
    if (Math.abs(t[0] - f[0]) + Math.abs(t[1] - f[1]) + Math.abs(t[2] - f[2]) < 5) return;
    const stack = [[x, y]], seen = new Uint8Array(w * h);
    while (stack.length) {
      const [px, py] = stack.pop(); const p = py * w + px;
      if (px < 0 || py < 0 || px >= w || py >= h || seen[p]) continue;
      seen[p] = 1; const i = p * 4; if (!near(i)) continue;
      d[i] = f[0]; d[i + 1] = f[1]; d[i + 2] = f[2]; d[i + 3] = 255;
      stack.push([px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]);
    }
    ctx.putImageData(img, 0, 0);
  }
  c.addEventListener("pointerdown", (e) => {
    c.setPointerCapture(e.pointerId); const p = pos(e); pushUndo();
    if (tool === "fill") { flood(p.x, p.y); persist(); return; }
    drawing = true; start = p; snap = ctx.getImageData(0, 0, c.width, c.height);
    if (tool === "pen" || tool === "eraser") { stroke(p); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 0.01, p.y); ctx.stroke(); }
  });
  c.addEventListener("pointermove", (e) => {
    if (!drawing) return; const p = pos(e);
    if (tool === "pen" || tool === "eraser") { stroke(p); ctx.lineTo(p.x, p.y); ctx.stroke(); }
    else shape(p);
  });
  const end = () => { if (drawing) { drawing = false; persist(); } };
  c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
  const doUndo = () => { const u = undo.pop(); if (u) { ctx.putImageData(u, 0, 0); persist(); } };
  document.getElementById("undo").onclick = doUndo;
  addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); doUndo(); } });
  document.getElementById("clear").onclick = () => { pushUndo(); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); persist(); };
  document.getElementById("save").onclick = () => { const a = document.createElement("a"); a.href = c.toDataURL("image/png"); a.download = "drawing.png"; a.click(); };
  new ResizeObserver(resize).observe(board);
  resize(); restore(); mark();
})();
</script>
</body>
</html>
