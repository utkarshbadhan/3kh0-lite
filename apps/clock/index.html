<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer &amp; Stopwatch</title>
<link rel="stylesheet" href="/apps/app.css"><script src="/apps/app.js"></script>
<style>
  .tabs { display: flex; gap: 6px; padding: 6px; border-radius: 16px; background: rgba(255,255,255,.05); width: max-content; margin: 0 auto; }
  .tabs button { padding: 8px 18px; border: 0; border-radius: 12px; background: none; cursor: pointer; font-weight: 700; color: var(--muted); }
  .tabs button.on { background: var(--grad); color: #fff; }
  .face { flex: 1; display: grid; place-items: center; text-align: center; }
  .ring { position: relative; width: min(340px, 70vw); aspect-ratio: 1; margin: 0 auto 22px; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .track { stroke: rgba(255,255,255,.08); }
  .ring .prog { stroke: url(#g); stroke-linecap: round; transition: stroke-dashoffset .2s linear; }
  .time { position: absolute; inset: 0; display: grid; place-items: center; font: 800 clamp(34px, 9vw, 62px)/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -.03em; }
  .laps { max-height: 160px; overflow-y: auto; width: min(360px, 90vw); margin: 16px auto 0; text-align: left; font-family: ui-monospace, monospace; }
  .laps div { display: flex; justify-content: space-between; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .set { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
  .set input { width: 80px; text-align: center; font-size: 22px; font-weight: 700; }
  .presets { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
  .done .time { animation: blink .5s steps(2) infinite; color: var(--a2); }
  @keyframes blink { 50% { opacity: .3; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--a1)"/><stop offset=".6" stop-color="var(--a2)"/><stop offset="1" stop-color="var(--a3)"/></linearGradient></defs></svg>
<div class="wrap">
  <div class="tabs"><button class="on" data-tab="sw">Stopwatch</button><button data-tab="tm">Timer</button></div>

  <div class="face" id="sw">
    <div>
      <div class="ring"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="54"/><circle class="prog" id="sw-prog" cx="60" cy="60" r="54" stroke="url(#g)"/></svg><div class="time" id="sw-time">00:00.00</div></div>
      <div class="row" style="justify-content:center"><button class="btn" id="sw-go">Start</button><button class="btn ghost" id="sw-lap">Lap</button><button class="btn ghost" id="sw-reset">Reset</button></div>
      <div class="laps" id="laps"></div>
    </div>
  </div>

  <div class="face" id="tm" hidden>
    <div>
      <div class="ring" id="tm-ring"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="54"/><circle class="prog" id="tm-prog" cx="60" cy="60" r="54" stroke="url(#g)"/></svg><div class="time" id="tm-time">05:00</div></div>
      <div class="set" id="tm-set"><input class="field" id="tm-m" type="number" min="0" max="999" value="5" aria-label="Minutes"><span style="font-size:26px;align-self:center">:</span><input class="field" id="tm-s" type="number" min="0" max="59" value="0" aria-label="Seconds"></div>
      <div class="presets"><button class="btn sm ghost" data-m="1">1 min</button><button class="btn sm ghost" data-m="5">5 min</button><button class="btn sm ghost" data-m="10">10 min</button><button class="btn sm ghost" data-m="25">25 min</button><button class="btn sm ghost" data-m="45">45 min</button></div>
      <div class="row" style="justify-content:center"><button class="btn" id="tm-go">Start</button><button class="btn ghost" id="tm-reset">Reset</button></div>
    </div>
  </div>
</div>
<script>
(function () {
  const C = 2 * Math.PI * 54;
  document.querySelectorAll(".prog").forEach((p) => { p.style.strokeDasharray = C; p.style.strokeDashoffset = C; });
  const pad = (n, l = 2) => String(Math.floor(n)).padStart(l, "0");
  document.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => {
    document.querySelectorAll("[data-tab]").forEach((x) => x.classList.toggle("on", x === b));
    document.getElementById("sw").hidden = b.dataset.tab !== "sw"; document.getElementById("tm").hidden = b.dataset.tab !== "tm";
  }));

  // Stopwatch
  let swStart = 0, swAcc = 0, swRun = false, laps = [], raf;
  const swFmt = (ms) => `${pad(ms / 60000)}:${pad((ms / 1000) % 60)}.${pad((ms / 10) % 100)}`;
  const swNow = () => swAcc + (swRun ? performance.now() - swStart : 0);
  function swTick() {
    const ms = swNow();
    document.getElementById("sw-time").textContent = swFmt(ms);
    document.getElementById("sw-prog").style.strokeDashoffset = C * (1 - (ms % 60000) / 60000);
    if (swRun) raf = requestAnimationFrame(swTick);
  }
  document.getElementById("sw-go").onclick = (e) => {
    if (swRun) { swAcc = swNow(); swRun = false; e.target.textContent = "Start"; }
    else { swStart = performance.now(); swRun = true; e.target.textContent = "Pause"; swTick(); }
  };
  document.getElementById("sw-lap").onclick = () => {
    if (!swNow()) return; laps.unshift(swNow());
    document.getElementById("laps").innerHTML = laps.map((t, i) => `<div><span class="muted">Lap ${laps.length - i}</span><span>+${swFmt(t - (laps[i + 1] || 0))}</span><b>${swFmt(t)}</b></div>`).join("");
  };
  document.getElementById("sw-reset").onclick = () => { swRun = false; swAcc = 0; laps = []; document.getElementById("laps").innerHTML = ""; document.getElementById("sw-go").textContent = "Start"; cancelAnimationFrame(raf); swTick(); };

  // Timer
  let total = 300000, end = 0, left = 300000, tmRun = false, tmInt, beepInt;
  const $m = document.getElementById("tm-m"), $s = document.getElementById("tm-s"), ring = document.getElementById("tm-ring");
  const tmFmt = (ms) => { const s = Math.ceil(ms / 1000); return s >= 3600 ? `${pad(s / 3600)}:${pad((s / 60) % 60)}:${pad(s % 60)}` : `${pad(s / 60)}:${pad(s % 60)}`; };
  function tmDraw() { document.getElementById("tm-time").textContent = tmFmt(left); document.getElementById("tm-prog").style.strokeDashoffset = C * (1 - left / total); }
  function readSet() { total = left = Math.max(1, (+$m.value || 0) * 60 + (+$s.value || 0)) * 1000; tmDraw(); }
  function beep() {
    try {
      const a = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.25, 0.5].forEach((t) => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(0.2, a.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + t + 0.2); o.start(a.currentTime + t); o.stop(a.currentTime + t + 0.22); });
    } catch (e) {}
  }
  function stopAlarm() { clearInterval(beepInt); ring.classList.remove("done"); }
  function tmTick() {
    left = Math.max(0, end - Date.now()); tmDraw();
    if (left <= 0) { clearInterval(tmInt); tmRun = false; document.getElementById("tm-go").textContent = "Start"; ring.classList.add("done"); beep(); beepInt = setInterval(beep, 1500); setTimeout(stopAlarm, 15000); }
  }
  document.getElementById("tm-go").onclick = (e) => {
    stopAlarm();
    if (tmRun) { clearInterval(tmInt); tmRun = false; e.target.textContent = "Resume"; return; }
    if (left <= 0) readSet();
    end = Date.now() + left; tmRun = true; e.target.textContent = "Pause"; tmInt = setInterval(tmTick, 200); tmTick();
  };
  document.getElementById("tm-reset").onclick = () => { clearInterval(tmInt); tmRun = false; stopAlarm(); document.getElementById("tm-go").textContent = "Start"; readSet(); };
  $m.oninput = $s.oninput = () => { if (!tmRun) readSet(); };
  document.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => { $m.value = b.dataset.m; $s.value = 0; document.getElementById("tm-reset").click(); }));
  swTick(); readSet();
})();
</script>
</body>
</html>
