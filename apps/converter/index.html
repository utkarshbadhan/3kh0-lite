<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit converter</title>
<link rel="stylesheet" href="/apps/app.css"><script src="/apps/app.js"></script>
<style>
  .box { width: min(640px, 100%); margin: 0 auto; display: grid; gap: 16px; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; }
  .cats button { padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; font-weight: 600; }
  .cats button.on { background: var(--grad); border-color: transparent; color: #fff; }
  .pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; }
  .pair label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  .pair .big { font-size: 28px; font-weight: 800; padding: 14px 16px; }
  .swap { width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--panel2); cursor: pointer; font-size: 20px; margin-bottom: 4px; }
  .all { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .all div { padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.04); font-size: 14px; }
  .all b { display: block; font-size: 16px; word-break: break-all; }
  @media (max-width: 520px) { .pair { grid-template-columns: 1fr; } .swap { justify-self: center; } }
</style>
</head>
<body>
<div class="wrap" style="overflow-y:auto">
  <div class="box">
    <h1>Unit <span class="grad-text">converter</span></h1>
    <div class="cats" id="cats"></div>
    <div class="panel pair">
      <label>From<input class="field big" id="v1" inputmode="decimal" value="1"><select class="field" id="u1"></select></label>
      <button class="swap" id="swap" title="Swap">⇄</button>
      <label>To<input class="field big" id="v2" inputmode="decimal"><select class="field" id="u2"></select></label>
    </div>
    <div class="panel"><div class="muted" style="font-size:13px;margin-bottom:10px" id="all-head"></div><div class="all" id="all"></div></div>
  </div>
</div>
<script>
(function () {
  // Each unit is [name, factor to the base unit]; temperature uses functions.
  const CATS = {
    Length: [["Millimetre", 0.001], ["Centimetre", 0.01], ["Metre", 1], ["Kilometre", 1000], ["Inch", 0.0254], ["Foot", 0.3048], ["Yard", 0.9144], ["Mile", 1609.344]],
    Mass: [["Milligram", 1e-6], ["Gram", 0.001], ["Kilogram", 1], ["Tonne", 1000], ["Ounce", 0.028349523125], ["Pound", 0.45359237], ["Stone", 6.35029318]],
    Temperature: [["Celsius", [(c) => c, (c) => c]], ["Fahrenheit", [(f) => (f - 32) * 5 / 9, (c) => c * 9 / 5 + 32]], ["Kelvin", [(k) => k - 273.15, (c) => c + 273.15]]],
    Volume: [["Millilitre", 0.001], ["Litre", 1], ["Cubic metre", 1000], ["Teaspoon (US)", 0.00492892], ["Tablespoon (US)", 0.0147868], ["Cup (US)", 0.236588], ["Pint (US)", 0.473176], ["Gallon (US)", 3.78541], ["Gallon (UK)", 4.54609]],
    Speed: [["Metres / second", 1], ["Kilometres / hour", 1 / 3.6], ["Miles / hour", 0.44704], ["Knot", 0.514444], ["Feet / second", 0.3048]],
    Area: [["Square metre", 1], ["Square kilometre", 1e6], ["Square foot", 0.09290304], ["Square yard", 0.83612736], ["Acre", 4046.8564224], ["Hectare", 10000], ["Square mile", 2589988.110336]],
    Time: [["Millisecond", 0.001], ["Second", 1], ["Minute", 60], ["Hour", 3600], ["Day", 86400], ["Week", 604800], ["Year", 31557600]],
    Data: [["Bit", 0.125], ["Byte", 1], ["Kilobyte", 1e3], ["Megabyte", 1e6], ["Gigabyte", 1e9], ["Terabyte", 1e12], ["Kibibyte", 1024], ["Mebibyte", 1048576], ["Gibibyte", 1073741824]],
  };
  const store = AppStore("convert");
  let cat = store.get("cat", "Length");
  const $ = (id) => document.getElementById(id);
  const toBase = (u, v) => (Array.isArray(u[1]) ? u[1][0](v) : v * u[1]);
  const fromBase = (u, v) => (Array.isArray(u[1]) ? u[1][1](v) : v / u[1]);
  const fmt = (n) => (!isFinite(n) ? "" : Math.abs(n) >= 1e12 || (n !== 0 && Math.abs(n) < 1e-6) ? n.toExponential(6) : String(+n.toPrecision(10)));
  function setCat(c) {
    cat = c; store.set("cat", c);
    $("cats").innerHTML = Object.keys(CATS).map((k) => `<button class="${k === c ? "on" : ""}" data-c="${k}">${k}</button>`).join("");
    const opts = CATS[c].map((u, i) => `<option value="${i}">${u[0]}</option>`).join("");
    $("u1").innerHTML = $("u2").innerHTML = opts; $("u2").value = Math.min(1, CATS[c].length - 1);
    if (c === "Temperature") { $("u1").value = 0; $("u2").value = 1; }
    calc(1);
  }
  function calc(from) {
    const U = CATS[cat], a = U[$("u1").value], b = U[$("u2").value];
    if (from === 1) { const v = parseFloat($("v1").value); $("v2").value = isNaN(v) ? "" : fmt(fromBase(b, toBase(a, v))); }
    else { const v = parseFloat($("v2").value); $("v1").value = isNaN(v) ? "" : fmt(fromBase(a, toBase(b, v))); }
    const v = parseFloat($("v1").value);
    $("all-head").textContent = isNaN(v) ? "" : `${$("v1").value} ${a[0].toLowerCase()} is`;
    $("all").innerHTML = isNaN(v) ? "" : U.map((u) => `<div><b>${fmt(fromBase(u, toBase(a, v)))}</b><span class="muted">${u[0]}</span></div>`).join("");
  }
  $("cats").onclick = (e) => { const b = e.target.closest("[data-c]"); if (b) setCat(b.dataset.c); };
  $("v1").oninput = () => calc(1); $("v2").oninput = () => calc(2);
  $("u1").onchange = () => calc(1); $("u2").onchange = () => calc(1);
  $("swap").onclick = () => { const t = $("u1").value; $("u1").value = $("u2").value; $("u2").value = t; calc(1); };
  setCat(CATS[cat] ? cat : "Length");
})();
</script>
</body>
</html>
