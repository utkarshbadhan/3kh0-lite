# Static hosting for the games and apps, plus the chat function in
# netlify/functions/. Netlify can't run the WebSocket proxy server.
[build]
  publish = "."
  command = "echo static site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
