<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScienceTube Study</title>
    <meta name="description" content="ScienceTube Study: a calendar, planner, notes, focus timer and other school tools that remember everything in your browser." />
    <meta name="theme-color" content="#f6f4ee" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/school.css" />
    <script>window.SCIENCETUBE_MODE = "school";</script>
  </head>
  <body class="school">
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="paper" aria-hidden="true"></div>

    <div class="shell">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <div class="brand">
          <a href="#/home" class="brand-link" aria-label="ScienceTube Study home">
            <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11.5V16c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5v-4.5"/><path d="M21 9v5"/></svg></span>
            <span class="brand-name">ScienceTube <em>Study</em></span>
          </a>
          <button class="icon-btn collapse-btn" id="collapse-btn" title="Collapse sidebar  [" aria-label="Collapse sidebar">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
          </button>
        </div>

        <button class="search-trigger" id="palette-open" aria-label="Search everything">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
          <span class="label">Search</span>
          <kbd>Ctrl K</kbd>
        </button>

        <nav class="nav" id="nav"></nav>

        <div class="sidebar-foot">
          <div class="mini-stat"><span id="stat-tasks">0</span><small>to do</small></div>
          <div class="mini-stat"><span id="stat-focus">0</span><small>focus min</small></div>
          <span id="stat-games" hidden></span><span id="stat-favs" hidden></span>
          <div class="proxy-dot" id="proxy-dot" title="Proxy status"><i></i><small>proxy</small></div>
        </div>
      </aside>
      <div class="scrim" id="scrim"></div>

      <!-- Main -->
      <main class="main" id="main">
        <header class="topbar">
          <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
          <div class="crumbs" id="crumbs">Home</div>
          <div class="topbar-actions">
            <span class="chip date-chip" id="today-chip"></span>
            <button class="chip" id="random-btn" hidden>
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" /><circle cx="8.5" cy="8.5" r="1.2" /><circle cx="15.5" cy="15.5" r="1.2" /><circle cx="12" cy="12" r="1.2" /></svg>
              <span>Surprise me</span>
            </button>
          </div>
        </header>

        <div id="view" class="view" tabindex="-1"></div>
      </main>
    </div>

    <!-- Command palette -->
    <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search" hidden>
      <div class="palette-box">
        <div class="palette-input">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
          <input id="palette-input" placeholder="Search tools, games and sections…" autocomplete="off" spellcheck="false" />
          <kbd>Esc</kbd>
        </div>
        <ul class="palette-list" id="palette-list"></ul>
        <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>1</kbd>–<kbd>9</kbd> jump to section</span></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/js/main.js"></script>
    <script src="/js/school.js"></script>
    <script src="/js/proxy-config.js"></script>
    <script src="/js/proxy.js"></script>
    <script src="/js/chat-config.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/fx.js"></script>
  </body>
</html>
